<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Guitar Lesson | Guy Haik</title>
    <meta name="description" content="Book a personalized guitar lesson with Guy Haik." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  </head>
  <body>
    <div class="page-shell">
      <header id="site-header"></header>
      <main class="page booking-page">
        <section class="booking-card">
          <p class="eyebrow">Calendar</p>
          <h1>Book a guitar lesson</h1>
          <p>Choose a convenient time for your lesson. Google Calendar will send a confirmation and invite to you and Guy.</p>
          <a id="booking-link" class="btn btn-primary" href="#">Choose a lesson time</a>
          <p id="booking-setup" class="booking-note is-hidden">Guy's booking calendar is being set up. Please check back soon.</p>
        </section>
      </main>
      <footer id="site-footer"></footer>
    </div>
    <script type="module" src="scripts/booking.js"></script>
  </body>
</html>
